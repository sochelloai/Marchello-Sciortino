name: Automated Daily Blog Post

on:
  schedule:
    # Run every day at 12:00 PM UTC (equivalent to 7:00 AM Central Time)
    - cron: '0 12 * * *'
    # Backup run every day at 3:00 PM UTC (equivalent to 10:00 AM Central Time)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual trigger on demand
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-daily-post.yml'
      - 'scripts/generate-daily-post.js'

permissions:
  contents: read

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow pushing commits back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Daily Blog Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-daily-post.js

      - name: Commit and Push Changes
        run: |
          # Configure Git User using verified GitHub Actions bot credentials
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage changes
          git add data/articles.json
          git add assets/blog/ 2>/dev/null || true
          
          # Check if there are changes staged for commit
          if git diff --cached --quiet; then
            echo "No changes generated today. Skipping commit."
          else
            git commit -m "chore: automated daily blog post for $(date +'%Y-%m-%d')"
            git push origin main
          fi
