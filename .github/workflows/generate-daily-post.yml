name: Automated Daily Blog Post

on:
  schedule:
    # Run every day at 12:17 PM UTC (6:17 AM CST / 7:17 AM CDT — off-minute avoids top-of-hour GitHub queue delays)
    - cron: '17 12 * * *'
    # Backup run every day at 3:17 PM UTC (9:17 AM CST / 10:17 AM CDT)
    - cron: '17 15 * * *'
  workflow_dispatch: # Allows manual trigger on demand
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-daily-post.yml'
      - 'scripts/generate-daily-post.js'

concurrency:
  group: automated-daily-blog-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow pushing commits back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Daily Blog Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-daily-post.js

      - name: Commit and Push Changes
        run: |
          # Configure Git User using verified GitHub Actions bot credentials
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage changes
          git add data/articles.json
          git add assets/blog/ 2>/dev/null || true
          
          # Check if there are changes staged for commit
          if git diff --cached --quiet; then
            echo "No changes generated today. Skipping commit."
          else
            git commit -m "chore: automated daily blog post for $(TZ=America/Chicago date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Warm Instagram Feed & Auto-Refresh Token
        run: |
          curl -fsS "https://www.marchellosciortino.com/api/instagram" >/dev/null || true
